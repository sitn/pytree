version: "3.8"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV}
    restart: unless-stopped
    command: python /app/start.py
    volumes:
      - ${DATA_DIR}:/app/${DATA_DIR}
      - ${CONFIG_FILE}:/app/pytree.yml
    ports:
      - "${PORT}:${PORT}"
